name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --ignore-scripts skips native postinstall builds (better-sqlite3 needs a
      # C++ toolchain). Nothing below runs the server, so type declarations are
      # all we need, and this keeps the job fast and portable.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      # The sqlite/ and pg/ schemas are hand-mirrored with nothing in the type
      # system tying them together. This is what stops them drifting apart.
      - name: Schema parity (sqlite vs postgres)
        run: bun run check:schema

      - name: Page structure
        run: bun run check:pages

      - name: Log contrast
        run: bun run check:contrast

  secrets:
    name: Secret and artifact hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitignore does not apply to files that are already tracked, so a file
      # committed before it was ignored stays committed. .kamal/secrets was
      # tracked this way — harmless as a template, one `git add` from real
      # credentials. This fails the build if that happens again.
      - name: No gitignored files are tracked
        run: |
          tracked_but_ignored=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$tracked_but_ignored" ]; then
            echo "::error::These files are tracked but match .gitignore:"
            echo "$tracked_but_ignored"
            exit 1
          fi
          echo "OK — no tracked files are gitignored."

      - name: No committed .env file
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked. Use example.env instead."
            exit 1
          fi
          echo "OK — .env is not tracked."
